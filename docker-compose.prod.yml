# Production. Runs on the mini-PC driving the TV at the booth.
services:
  kiosk:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        APP_VERSION: ${APP_VERSION}
        NODE_VERSION: ${NODE_VERSION}
    image: ${DOCKER_IMAGE}:${APP_VERSION}
    ports:
      - "${PROD_PORT}:3000"
    env_file:
      - .env
    # The booth machine will be power-cycled and nobody will be there to bring
    # it back up.
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
