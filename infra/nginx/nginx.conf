# Main nginx configuration for the kiosk edge proxy.
#
# Replaces the image default at /etc/nginx/nginx.conf. Server blocks are not
# defined here: they are rendered from infra/nginx/templates/*.template by the
# image's envsubst entrypoint, so every host-specific value stays in the root
# `.env` (see AGENTS.md §5).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # An absent Upgrade header must produce `Connection: close`, not
    # `Connection: upgrade` — otherwise every ordinary request is advertised as
    # a failed websocket handshake.
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # The kiosk browser sits on the same LAN as the server and holds one long
    # session. Server tokens leak the nginx version to anyone who curls the port.
    server_tokens   off;

    # Next.js streams RSC payloads. Buffering them defeats the streaming.
    proxy_buffering        off;
    proxy_http_version     1.1;
    proxy_read_timeout     300s;
    proxy_send_timeout     300s;
    client_max_body_size   16m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml
                      font/woff font/woff2;

    include /etc/nginx/conf.d/*.conf;
}
